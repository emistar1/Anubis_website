<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/ico" href="anubis.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anubis Music Player — Coming Soon</title>
<style>
  :root {
    --bg: #000000;
    --text: #ffffff;
    --text-dim: rgba(255, 255, 255, 0.6);
    --bar-bg: rgba(255, 255, 255, 0.04);
    --bar-border: rgba(255, 255, 255, 0.1);
    --btn-bg: rgba(255, 255, 255, 0.06);
    --btn-border: rgba(255, 255, 255, 0.18);
    --btn-hover-bg: rgba(255, 255, 255, 0.12);
    --btn-hover-border: rgba(255, 255, 255, 0.35);
    --orb-opacity: 0.55;
    --orb2-opacity: 0.3;
    --orb-color: radial-gradient(circle at 35% 35%, #b57bff 0%, #7c3aed 35%, #4c1d95 65%, transparent 75%);
    --orb2-color: radial-gradient(circle at 40% 40%, #d8b4fe 0%, #9333ea 50%, transparent 75%);
  }

  [data-theme="light"] {
    --bg: #f4f2f8;
    --text: #1a1625;
    --text-dim: rgba(26, 22, 37, 0.6);
    --bar-bg: rgba(255, 255, 255, 0.5);
    --bar-border: rgba(0, 0, 0, 0.08);
    --btn-bg: rgba(255, 255, 255, 0.6);
    --btn-border: rgba(0, 0, 0, 0.12);
    --btn-hover-bg: rgba(255, 255, 255, 0.85);
    --btn-hover-border: rgba(0, 0, 0, 0.2);
    --orb-opacity: 0.55;
    --orb2-opacity: 0.32;
    --orb-color: radial-gradient(circle at 35% 35%, #ffb3b3 0%, #ef4444 35%, #991b1b 65%, transparent 75%);
    --orb2-color: radial-gradient(circle at 40% 40%, #ffd6d6 0%, #f87171 50%, transparent 75%);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    transition: background 0.4s ease;
  }

  body {
    position: relative;
  }

  .topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    background: var(--bar-bg);
    border-bottom: 1px solid var(--bar-border);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 10;
    transition: background 0.4s ease, border-color 0.4s ease;
  }

  .brand {
    color: var(--text);
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.01em;
    transition: color 0.4s ease;
  }

  .theme-toggle {
    position: relative;
    width: 52px;
    height: 28px;
    border-radius: 999px;
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    cursor: pointer;
    transition: background 0.3s ease, border-color 0.3s ease;
    display: flex;
    align-items: center;
    padding: 3px;
  }

  .theme-toggle .knob {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: transparent;
    transition: transform 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
  }

  [data-theme="light"] .theme-toggle .knob {
    transform: translateX(24px);
  }

  .orb-wrap {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .orb {
    position: absolute;
    width: 42vw;
    height: 42vw;
    max-width: 480px;
    max-height: 480px;
    min-width: 240px;
    min-height: 240px;
    border-radius: 50%;
    background: var(--orb-color);
    filter: blur(80px);
    opacity: var(--orb-opacity);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    transition: opacity 0.4s ease, background 0.4s ease;
    will-change: transform;
  }

  .orb.secondary {
    width: 22vw;
    height: 22vw;
    max-width: 260px;
    max-height: 260px;
    min-width: 130px;
    min-height: 130px;
    background: var(--orb2-color);
    opacity: var(--orb2-opacity);
    filter: blur(60px);
    transition: background 0.4s ease;
  }

  .main {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 100px 24px 40px;
    gap: 22px;
  }

  .eyebrow {
    color: var(--text-dim);
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    transition: color 0.4s ease;
  }

  .title {
    color: var(--text);
    font-size: clamp(2.2rem, 6vw, 4rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    transition: color 0.4s ease;
  }

  .lore {
    max-width: 560px;
    color: var(--text-dim);
    font-size: 0.95rem;
    line-height: 1.6;
    transition: color 0.4s ease;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 4px;
    color: var(--text-dim);
    font-size: 0.85rem;
    letter-spacing: 0.02em;
    transition: color 0.4s ease;
  }

  .status .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #9333ea;
    animation: pulse 2s infinite;
  }

  [data-theme="light"] .status .dot {
    background: #ef4444;
    animation: pulse-light 2s infinite;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(147, 51, 234, 0.5); }
    70%  { box-shadow: 0 0 0 10px rgba(147, 51, 234, 0); }
    100% { box-shadow: 0 0 0 0 rgba(147, 51, 234, 0); }
  }

  @keyframes pulse-light {
    0%   { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
    70%  { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
    100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
  }

  .notify {
    display: flex;
    gap: 10px;
    margin-top: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .notify input[type="email"] {
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--text);
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    border-radius: 999px;
    padding: 14px 22px;
    width: 260px;
    max-width: 60vw;
    outline: none;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: background 0.25s ease, border-color 0.25s ease, color 0.4s ease;
  }

  .notify input[type="email"]::placeholder {
    color: var(--text-dim);
  }

  .notify input[type="email"]:focus {
    background: var(--btn-hover-bg);
    border-color: var(--btn-hover-border);
  }

  .btn {
    text-decoration: none;
    color: #ffffff;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 14px 30px;
    border-radius: 999px;
    background: linear-gradient(135deg, #9333ea, #6d28d9);
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 4px 22px rgba(147, 51, 234, 0.4);
    transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.4s ease;
    cursor: pointer;
    white-space: nowrap;
  }

  [data-theme="light"] .btn {
    background: linear-gradient(135deg, #ef4444, #b91c1c);
    box-shadow: 0 4px 22px rgba(239, 68, 68, 0.35);
  }

  .btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 30px rgba(147, 51, 234, 0.6);
  }

  [data-theme="light"] .btn:hover {
    box-shadow: 0 8px 30px rgba(239, 68, 68, 0.5);
  }

  .btn:active {
    transform: translateY(-1px);
  }
</style>
</head>
<body data-theme="dark">

  <div class="topbar">
    <div class="brand">Anubis Music Player</div>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle light and dark mode">
      <div class="knob" id="themeKnob">🌙</div>
    </button>
  </div>

  <div class="orb-wrap">
    <div class="orb" id="orb"></div>
    <div class="orb secondary" id="orb2"></div>
  </div>

  <div class="main">
    <h1 class="title">Coming Soon</h1>

    <div class="status">
      <span class="dot"></span>
      In development
    </div>
  </div>

  <script>
    const body = document.body;
    const toggle = document.getElementById('themeToggle');
    const knob = document.getElementById('themeKnob');

    toggle.addEventListener('click', () => {
      const isLight = body.getAttribute('data-theme') === 'light';
      body.setAttribute('data-theme', isLight ? 'dark' : 'light');
      knob.textContent = isLight ? '🌙' : '☀️';
    });

    const orb = document.getElementById('orb');
    const orb2 = document.getElementById('orb2');

    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let orbX = mouseX;
    let orbY = mouseY;
    let orb2X = mouseX;
    let orb2Y = mouseY;

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    function animate() {
      orbX += (mouseX - orbX) * 0.06;
      orbY += (mouseY - orbY) * 0.06;

      orb2X += (mouseX - orb2X) * 0.03;
      orb2Y += (mouseY - orb2Y) * 0.03;

      orb.style.left = orbX + 'px';
      orb.style.top = orbY + 'px';

      orb2.style.left = orb2X + 'px';
      orb2.style.top = orb2Y + 'px';

      requestAnimationFrame(animate);
    }

    animate();
  </script>

</body>
</html>
