<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title href="./index.html">Anubis Music Player — Download</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
  :root {
    --bg: #000000;
    --text: #ffffff;
    --text-dim: rgba(255, 255, 255, 0.6);
    --bar-bg: rgba(255, 255, 255, 0.04);
    --bar-border: rgba(255, 255, 255, 0.1);
    --btn-bg: rgba(255, 255, 255, 0.06);
    --btn-border: rgba(255, 255, 255, 0.18);
    --btn-hover-bg: rgba(255, 255, 255, 0.12);
    --btn-hover-border: rgba(255, 255, 255, 0.35);
    --orb-opacity: 0.55;
    --orb2-opacity: 0.3;
    --orb-color: radial-gradient(circle at 35% 35%, #b57bff 0%, #7c3aed 35%, #4c1d95 65%, transparent 75%);
    --orb2-color: radial-gradient(circle at 40% 40%, #d8b4fe 0%, #9333ea 50%, transparent 75%);
    --accent: #9333ea;
    --accent-dim: rgba(147, 51, 234, 0.15);
  }

  [data-theme="light"] {
    --bg: #f4f2f8;
    --text: #1a1625;
    --text-dim: rgba(26, 22, 37, 0.6);
    --bar-bg: rgba(255, 255, 255, 0.5);
    --bar-border: rgba(0, 0, 0, 0.08);
    --btn-bg: rgba(255, 255, 255, 0.6);
    --btn-border: rgba(0, 0, 0, 0.12);
    --btn-hover-bg: rgba(255, 255, 255, 0.85);
    --btn-hover-border: rgba(0, 0, 0, 0.2);
    --orb-opacity: 0.55;
    --orb2-opacity: 0.32;
    --orb-color: radial-gradient(circle at 35% 35%, #ffb3b3 0%, #ef4444 35%, #991b1b 65%, transparent 75%);
    --orb2-color: radial-gradient(circle at 40% 40%, #ffd6d6 0%, #f87171 50%, transparent 75%);
    --accent: #ef4444;
    --accent-dim: rgba(239, 68, 68, 0.12);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    min-height: 100%;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    transition: background 0.4s ease;
  }

  body {
    position: relative;
  }

  .topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    background: var(--bar-bg);
    border-bottom: 1px solid var(--bar-border);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 10;
    transition: background 0.4s ease, border-color 0.4s ease;
  }

  .brand {
    color: var(--text);
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.01em;
    transition: color 0.4s ease;
  }

  .theme-toggle {
    position: relative;
    width: 52px;
    height: 28px;
    border-radius: 999px;
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    cursor: pointer;
    transition: background 0.3s ease, border-color 0.3s ease;
    display: flex;
    align-items: center;
    padding: 3px;
  }

  .theme-toggle .knob {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: transparent;
    transition: transform 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
  }

  [data-theme="light"] .theme-toggle .knob {
    transform: translateX(24px);
  }

  .orb-wrap {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .orb {
    position: absolute;
    width: 42vw;
    height: 42vw;
    max-width: 480px;
    max-height: 480px;
    min-width: 240px;
    min-height: 240px;
    border-radius: 50%;
    background: var(--orb-color);
    filter: blur(80px);
    opacity: var(--orb-opacity);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    transition: opacity 0.4s ease, background 0.4s ease;
    will-change: transform;
  }

  .orb.secondary {
    width: 22vw;
    height: 22vw;
    max-width: 260px;
    max-height: 260px;
    min-width: 130px;
    min-height: 130px;
    background: var(--orb2-color);
    opacity: var(--orb2-opacity);
    filter: blur(60px);
    transition: background 0.4s ease;
  }

  .main {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 120px 24px 60px;
    gap: 32px;
  }

  .title {
    color: var(--text);
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    transition: color 0.4s ease;
  }

  .subtitle {
    max-width: 480px;
    margin-top: -18px;
    color: var(--text-dim);
    font-size: 0.95rem;
    line-height: 1.6;
    transition: color 0.4s ease;
  }

  /* Download list */
  .downloads {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    max-width: 420px;
  }

  .downloads li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 18px 24px;
    border-radius: 16px;
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 4px 20px rgba(124, 58, 237, 0.12);
    transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
  }

  [data-theme="light"] .downloads li {
    box-shadow: 0 4px 20px rgba(239, 68, 68, 0.1);
  }

  .downloads li:hover {
    transform: translateY(-2px);
    background: var(--btn-hover-bg);
    border-color: var(--btn-hover-border);
  }

  .platform {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .platform .icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: var(--accent-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
  }

  .platform-info {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
  }

  .platform-name {
    color: var(--text);
    font-weight: 600;
    font-size: 1rem;
    transition: color 0.4s ease;
  }

  .platform-sub {
    color: var(--text-dim);
    font-size: 0.78rem;
    transition: color 0.4s ease;
  }

  .downloads a.link {
    color: var(--accent);
    font-weight: 600;
    font-size: 0.92rem;
    text-decoration: none;
    letter-spacing: 0.01em;
    white-space: nowrap;
    transition: opacity 0.2s ease;
  }

  .downloads a.link:hover {
    opacity: 0.7;
    text-decoration: underline;
  }
</style>
</head>
<body data-theme="dark">

  <div class="topbar">
    <a class="brand" href="http://anubismp.cc">Anubis Music Player</a>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle light and dark mode">
      <div class="knob" id="themeKnob">🌙</div>
    </button>
  </div>

  <div class="orb-wrap">
    <div class="orb" id="orb"></div>
    <div class="orb secondary" id="orb2"></div>
  </div>

  <div class="main">
    <h1 class="title">Download</h1>
    <p class="subtitle">Choose your platform below to get started with Anubis Music Player.</p>

    <ul class="downloads">
      <li>
        <div class="platform">
          <div class="icon">
            <svg width="18" height="18" viewBox="0 0 88 88" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M0 12.4L36 7.5V42.2H0V12.4Z" fill="var(--accent)"/>
              <path d="M40.4 7L88 0V42.2H40.4V7Z" fill="var(--accent)"/>
              <path d="M0 46.2H36V80.9L0 75.9V46.2Z" fill="var(--accent)"/>
              <path d="M40.4 46.2H88V88L40.4 81.4V46.2Z" fill="var(--accent)"/>
            </svg>
          </div>
          <div class="platform-info">
            <span class="platform-name">Windows</span>
            <span class="platform-sub" id="win-sub">Windows download</span>
          </div>
        </div>
        <a href="#" class="link" id="win-link">Download</a>
      </li>

      <li>
        <div class="platform">
          <div class="icon">
            <svg width="17" height="17" viewBox="0 0 384 512" fill="var(--accent)" xmlns="http://www.w3.org/2000/svg">
              <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141 0 184.5 0 273.4c0 26.4 4.8 53.6 14.4 81.7 12.8 37.5 59 129.4 107.2 127.9 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-84.4 102.6-121.9-65.2-30.7-57.7-89.9-57.7-92.4zM256.4 74.9c27.5-32.8 25-62.7 24.2-73.4-24.3 1.4-52.5 16.6-68.7 35.3-18 19.9-28.6 44.6-26.4 72.1 26.4 2.1 50.5-11.4 70.9-34z"/>
            </svg>
          </div>
          <div class="platform-info">
            <span class="platform-name">macOS</span>
            <span class="platform-sub" id="mac-sub">macOS download</span>
          </div>
        </div>
        <a href="#" class="link" id="mac-link">Download</a>
      </li>

      <li>
        <div class="platform">
          <div class="icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 18 22 12 16 6"></polyline>
              <polyline points="8 6 2 12 8 18"></polyline>
            </svg>
          </div>
          <div class="platform-info">
            <span class="platform-name">Source Code</span>
            <span class="platform-sub">See the magic under the hood</span>
          </div>
        </div>
        <a href="https://github.com/emistar1/Anubis_MP" class="link" target="_blank" rel="noopener">View on GitHub</a>
      </li>
    </ul>
  </div>

  <script>
    const GITHUB_REPO = 'emistar1/Anubis_MP';

    async function getLatestRelease() {
      const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/releases/latest`);
      if (!res.ok) throw new Error('Failed to fetch latest release');
      const data = await res.json();
      return data;
    }

    function findAsset(assets, keyword) {
      return assets.find(a => a.name.toLowerCase().includes(keyword));
    }

    async function setupDownloadLinks() {
      const winLink = document.getElementById('win-link');
      const macLink = document.getElementById('mac-link');
      const winSub = document.getElementById('win-sub');
      const macSub = document.getElementById('mac-sub');

      try {
        const release = await getLatestRelease();
        const assets = release.assets || [];

        const winAsset = findAsset(assets, 'windows') || findAsset(assets, '.exe');
        const macAsset = findAsset(assets, 'mac') || findAsset(assets, '.dmg');

        if (winAsset) {
          winLink.href = winAsset.browser_download_url;
          winSub.textContent = `${release.tag_name} · Windows 10 / 11 (64-bit)`;
        } else {
          winLink.textContent = 'Not compiled yet!';
          winLink.style.opacity = '1';
          winLink.style.pointerEvents = 'none';
        }

        if (macAsset) {
          macLink.href = macAsset.browser_download_url;
          macSub.textContent = `${release.tag_name} · macOS 12 or later`;
        } else {
          macLink.textContent = 'Not available';
          macLink.style.opacity = '0.5';
          macLink.style.pointerEvents = 'none';
        }
      } catch (err) {
        console.error('Could not load latest release:', err);
        winLink.textContent = 'Error with release';
        macLink.textContent = 'Error with release';
        winLink.style.opacity = '0.5';
        macLink.style.opacity = '0.5';
        winLink.style.pointerEvents = 'none';
        macLink.style.pointerEvents = 'none';
      }
    }

    setupDownloadLinks();

    const body = document.body;
    const toggle = document.getElementById('themeToggle');
    const knob = document.getElementById('themeKnob');

    toggle.addEventListener('click', () => {
      const isLight = body.getAttribute('data-theme') === 'light';
      body.setAttribute('data-theme', isLight ? 'dark' : 'light');
      knob.textContent = isLight ? '🌙' : '☀️';
    });

    const orb = document.getElementById('orb');
    const orb2 = document.getElementById('orb2');

    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let orbX = mouseX;
    let orbY = mouseY;
    let orb2X = mouseX;
    let orb2Y = mouseY;

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    function animate() {
      orbX += (mouseX - orbX) * 0.06;
      orbY += (mouseY - orbY) * 0.06;

      orb2X += (mouseX - orb2X) * 0.03;
      orb2Y += (mouseY - orb2Y) * 0.03;

      orb.style.left = orbX + 'px';
      orb.style.top = orbY + 'px';

      orb2.style.left = orb2X + 'px';
      orb2.style.top = orb2Y + 'px';

      requestAnimationFrame(animate);
    }

    animate();
  </script>

</body>
</html>
